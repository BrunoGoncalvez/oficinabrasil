<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="948" viewBox="0 0 1440 948" role="img" aria-label="Arquitetura e modelo · monólito em camadas"><rect width="100%" height="100%" fill="#f8fafc"/><style>text{font-family:Arial,sans-serif;fill:#172033}.title{font-size:28px;font-weight:bold}.sub{font-size:16px}.label{font-size:15px;font-weight:bold}.body{font-size:16px}</style><text x="32" y="42" class="title">Arquitetura e modelo · monólito em camadas</text><text x="32" y="74" class="sub">Um processo ASP.NET Core; MySQL relacional; adaptador SMTP. Nenhum microsserviço ou broker é necessário.</text><text x="44" y="114" class="label">ATOR</text><text x="234" y="114" class="label">COMANDO / AÇÃO</text><text x="584" y="114" class="label">EVENTO / RESULTADO</text><text x="964" y="114" class="label">REGRA / POLÍTICA</text><rect x="32" y="132" width="170" height="104" rx="10" fill="#fef3c7" stroke="#cbd5e1"/><text x="44" y="160" class="body">API</text><rect x="222" y="132" width="330" height="104" rx="10" fill="#cffafe" stroke="#cbd5e1"/><text x="234" y="160" class="body">Controllers / JWT / DTOs</text><rect x="572" y="132" width="360" height="104" rx="10" fill="#fed7aa" stroke="#cbd5e1"/><text x="584" y="160" class="body">HTTP → casos de uso</text><rect x="952" y="132" width="456" height="104" rx="10" fill="#ede9fe" stroke="#cbd5e1"/><text x="964" y="160" class="body">Autorizações por papel; erros 400/404/409</text><rect x="32" y="260" width="170" height="104" rx="10" fill="#fef3c7" stroke="#cbd5e1"/><text x="44" y="288" class="body">Application</text><rect x="222" y="260" width="330" height="104" rx="10" fill="#cffafe" stroke="#cbd5e1"/><text x="234" y="288" class="body">UseCases + IWorkshopData</text><rect x="572" y="260" width="360" height="104" rx="10" fill="#fed7aa" stroke="#cbd5e1"/><text x="584" y="288" class="body">Orquestração do negócio</text><rect x="952" y="260" width="456" height="104" rx="10" fill="#ede9fe" stroke="#cbd5e1"/><text x="964" y="288" class="body">Depende de Domain; desconhece EF e MySQL</text><rect x="32" y="388" width="170" height="104" rx="10" fill="#fef3c7" stroke="#cbd5e1"/><text x="44" y="416" class="body">Domain</text><rect x="222" y="388" width="330" height="104" rx="10" fill="#cffafe" stroke="#cbd5e1"/><text x="234" y="416" class="body">ServiceOrder / Estimate / Part</text><rect x="572" y="388" width="360" height="104" rx="10" fill="#fed7aa" stroke="#cbd5e1"/><text x="584" y="416" class="body">Regras e transições</text><rect x="952" y="388" width="456" height="104" rx="10" fill="#ede9fe" stroke="#cbd5e1"/><text x="964" y="416" class="body">DocumentNumber e LicensePlate validam</text><text x="964" y="439" class="body">valores nas fronteiras do negócio</text><rect x="32" y="516" width="170" height="104" rx="10" fill="#fef3c7" stroke="#cbd5e1"/><text x="44" y="544" class="body">Infrastructure</text><rect x="222" y="516" width="330" height="104" rx="10" fill="#cffafe" stroke="#cbd5e1"/><text x="234" y="544" class="body">EF Core / repositórios / MySQL</text><rect x="572" y="516" width="360" height="104" rx="10" fill="#fed7aa" stroke="#cbd5e1"/><text x="584" y="544" class="body">Persistência dos agregados</text><rect x="952" y="516" width="456" height="104" rx="10" fill="#ede9fe" stroke="#cbd5e1"/><text x="964" y="544" class="body">SaveChanges transacional; concorrência</text><text x="964" y="567" class="body">em saldo, estado e versão do orçamento</text><rect x="32" y="644" width="170" height="104" rx="10" fill="#fef3c7" stroke="#cbd5e1"/><text x="44" y="672" class="body">Adaptador SMTP</text><rect x="222" y="644" width="330" height="104" rx="10" fill="#cffafe" stroke="#cbd5e1"/><text x="234" y="672" class="body">Worker → servidor SMTP</text><rect x="572" y="644" width="360" height="104" rx="10" fill="#fed7aa" stroke="#cbd5e1"/><text x="584" y="672" class="body">Entrega de orçamento</text><rect x="952" y="644" width="456" height="104" rx="10" fill="#ede9fe" stroke="#cbd5e1"/><text x="964" y="672" class="body">Fila persistida no orçamento;</text><text x="964" y="695" class="body">entrega pelo menos uma vez</text><rect x="32" y="772" width="170" height="104" rx="10" fill="#fef3c7" stroke="#cbd5e1"/><text x="44" y="800" class="body">Relacionamentos</text><rect x="222" y="772" width="330" height="104" rx="10" fill="#cffafe" stroke="#cbd5e1"/><text x="234" y="800" class="body">Cliente 1:N veículo 1:N OS</text><rect x="572" y="772" width="360" height="104" rx="10" fill="#fed7aa" stroke="#cbd5e1"/><text x="584" y="800" class="body">OS 1:N itens; OS 1:1 orçamento</text><rect x="952" y="772" width="456" height="104" rx="10" fill="#ede9fe" stroke="#cbd5e1"/><text x="964" y="800" class="body">Item de serviço → catálogo de serviços;</text><text x="964" y="823" class="body">item de peça e movimento → peça</text></svg>
