<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1204" viewBox="0 0 1440 1204" role="img" aria-label="Event Storming · acompanhamento e execução"><rect width="100%" height="100%" fill="#f8fafc"/><style>text{font-family:Arial,sans-serif;fill:#172033}.title{font-size:28px;font-weight:bold}.sub{font-size:16px}.label{font-size:15px;font-weight:bold}.body{font-size:16px}</style><text x="32" y="42" class="title">Event Storming · acompanhamento e execução</text><text x="32" y="74" class="sub">Fluxo de estados, autorização e entrega. APROVADA e CANCELADA complementam os seis estados mínimos.</text><text x="44" y="114" class="label">ATOR</text><text x="234" y="114" class="label">COMANDO / AÇÃO</text><text x="584" y="114" class="label">EVENTO / RESULTADO</text><text x="964" y="114" class="label">REGRA / POLÍTICA</text><rect x="32" y="132" width="170" height="104" rx="10" fill="#fef3c7" stroke="#cbd5e1"/><text x="44" y="160" class="body">Cliente</text><rect x="222" y="132" width="330" height="104" rx="10" fill="#cffafe" stroke="#cbd5e1"/><text x="234" y="160" class="body">Aprovar orçamento</text><rect x="572" y="132" width="360" height="104" rx="10" fill="#fed7aa" stroke="#cbd5e1"/><text x="584" y="160" class="body">OS aprovada</text><rect x="952" y="132" width="456" height="104" rx="10" fill="#ede9fe" stroke="#cbd5e1"/><text x="964" y="160" class="body">AGUARDANDO_APROVACAO → APROVADA</text><rect x="32" y="260" width="170" height="104" rx="10" fill="#fef3c7" stroke="#cbd5e1"/><text x="44" y="288" class="body">Cliente</text><rect x="222" y="260" width="330" height="104" rx="10" fill="#cffafe" stroke="#cbd5e1"/><text x="234" y="288" class="body">Reprovar orçamento</text><rect x="572" y="260" width="360" height="104" rx="10" fill="#fed7aa" stroke="#cbd5e1"/><text x="584" y="288" class="body">OS cancelada</text><rect x="952" y="260" width="456" height="104" rx="10" fill="#ede9fe" stroke="#cbd5e1"/><text x="964" y="288" class="body">Não consumir peças na rejeição</text><rect x="32" y="388" width="170" height="104" rx="10" fill="#fef3c7" stroke="#cbd5e1"/><text x="44" y="416" class="body">Mecânico</text><rect x="222" y="388" width="330" height="104" rx="10" fill="#cffafe" stroke="#cbd5e1"/><text x="234" y="416" class="body">Iniciar serviço</text><rect x="572" y="388" width="360" height="104" rx="10" fill="#fed7aa" stroke="#cbd5e1"/><text x="584" y="416" class="body">Execução iniciada; peças consumidas</text><rect x="952" y="388" width="456" height="104" rx="10" fill="#ede9fe" stroke="#cbd5e1"/><text x="964" y="416" class="body">APROVADA → EM_EXECUCAO; saldo</text><text x="964" y="439" class="body">e estado protegidos contra concorrência</text><rect x="32" y="516" width="170" height="104" rx="10" fill="#fef3c7" stroke="#cbd5e1"/><text x="44" y="544" class="body">Mecânico</text><rect x="222" y="516" width="330" height="104" rx="10" fill="#cffafe" stroke="#cbd5e1"/><text x="234" y="544" class="body">Concluir serviço</text><rect x="572" y="516" width="360" height="104" rx="10" fill="#fed7aa" stroke="#cbd5e1"/><text x="584" y="544" class="body">OS finalizada</text><rect x="952" y="516" width="456" height="104" rx="10" fill="#ede9fe" stroke="#cbd5e1"/><text x="964" y="544" class="body">EM_EXECUCAO → FINALIZADA;</text><text x="964" y="567" class="body">registrar término para tempo médio</text><rect x="32" y="644" width="170" height="104" rx="10" fill="#fef3c7" stroke="#cbd5e1"/><text x="44" y="672" class="body">Atendente</text><rect x="222" y="644" width="330" height="104" rx="10" fill="#cffafe" stroke="#cbd5e1"/><text x="234" y="672" class="body">Registrar entrega</text><rect x="572" y="644" width="360" height="104" rx="10" fill="#fed7aa" stroke="#cbd5e1"/><text x="584" y="672" class="body">Veículo entregue</text><rect x="952" y="644" width="456" height="104" rx="10" fill="#ede9fe" stroke="#cbd5e1"/><text x="964" y="672" class="body">FINALIZADA → ENTREGUE</text><rect x="32" y="772" width="170" height="104" rx="10" fill="#fef3c7" stroke="#cbd5e1"/><text x="44" y="800" class="body">Atendente</text><rect x="222" y="772" width="330" height="104" rx="10" fill="#cffafe" stroke="#cbd5e1"/><text x="234" y="800" class="body">Emitir link de acompanhamento</text><rect x="572" y="772" width="360" height="104" rx="10" fill="#fed7aa" stroke="#cbd5e1"/><text x="584" y="800" class="body">Acesso limitado à OS emitido</text><rect x="952" y="772" width="456" height="104" rx="10" fill="#ede9fe" stroke="#cbd5e1"/><text x="964" y="800" class="body">Token protegido com validade de 30 dias</text><rect x="32" y="900" width="170" height="104" rx="10" fill="#fef3c7" stroke="#cbd5e1"/><text x="44" y="928" class="body">Cliente</text><rect x="222" y="900" width="330" height="104" rx="10" fill="#cffafe" stroke="#cbd5e1"/><text x="234" y="928" class="body">Consultar andamento</text><rect x="572" y="900" width="360" height="104" rx="10" fill="#fed7aa" stroke="#cbd5e1"/><text x="584" y="928" class="body">Status da OS consultado</text><rect x="952" y="900" width="456" height="104" rx="10" fill="#ede9fe" stroke="#cbd5e1"/><text x="964" y="928" class="body">Token da OS; sem dados pessoais</text><rect x="32" y="1028" width="170" height="104" rx="10" fill="#fef3c7" stroke="#cbd5e1"/><text x="44" y="1056" class="body">Equipe interna</text><rect x="222" y="1028" width="330" height="104" rx="10" fill="#cffafe" stroke="#cbd5e1"/><text x="234" y="1056" class="body">Reemitir orçamento pendente</text><rect x="572" y="1028" width="360" height="104" rx="10" fill="#fed7aa" stroke="#cbd5e1"/><text x="584" y="1056" class="body">Novo link; e-mail reenfileirado</text><rect x="952" y="1028" width="456" height="104" rx="10" fill="#ede9fe" stroke="#cbd5e1"/><text x="964" y="1056" class="body">Invalidar token anterior; valores</text><text x="964" y="1079" class="body">preservados; decisão anterior proibida</text></svg>
