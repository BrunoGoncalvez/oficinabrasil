<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1076" viewBox="0 0 1440 1076" role="img" aria-label="Event Storming · criação e orçamento"><rect width="100%" height="100%" fill="#f8fafc"/><style>text{font-family:Arial,sans-serif;fill:#172033}.title{font-size:28px;font-weight:bold}.sub{font-size:16px}.label{font-size:15px;font-weight:bold}.body{font-size:16px}</style><text x="32" y="42" class="title">Event Storming · criação e orçamento</text><text x="32" y="74" class="sub">Visão da solução entregue. Eventos abaixo nomeiam resultados do negócio; não há mensageria distribuída.</text><text x="44" y="114" class="label">ATOR</text><text x="234" y="114" class="label">COMANDO / AÇÃO</text><text x="584" y="114" class="label">EVENTO / RESULTADO</text><text x="964" y="114" class="label">REGRA / POLÍTICA</text><rect x="32" y="132" width="170" height="104" rx="10" fill="#fef3c7" stroke="#cbd5e1"/><text x="44" y="160" class="body">Atendente</text><rect x="222" y="132" width="330" height="104" rx="10" fill="#cffafe" stroke="#cbd5e1"/><text x="234" y="160" class="body">Consultar cliente por CPF/CNPJ</text><rect x="572" y="132" width="360" height="104" rx="10" fill="#fed7aa" stroke="#cbd5e1"/><text x="584" y="160" class="body">Cliente localizado / não localizado</text><rect x="952" y="132" width="456" height="104" rx="10" fill="#ede9fe" stroke="#cbd5e1"/><text x="964" y="160" class="body">Documento válido; busca normalizada</text><rect x="32" y="260" width="170" height="104" rx="10" fill="#fef3c7" stroke="#cbd5e1"/><text x="44" y="288" class="body">Atendente</text><rect x="222" y="260" width="330" height="104" rx="10" fill="#cffafe" stroke="#cbd5e1"/><text x="234" y="288" class="body">Cadastrar cliente e veículo</text><rect x="572" y="260" width="360" height="104" rx="10" fill="#fed7aa" stroke="#cbd5e1"/><text x="584" y="288" class="body">Cliente e veículo cadastrados</text><rect x="952" y="260" width="456" height="104" rx="10" fill="#ede9fe" stroke="#cbd5e1"/><text x="964" y="288" class="body">CPF/CNPJ e placa únicos; ano válido</text><rect x="32" y="388" width="170" height="104" rx="10" fill="#fef3c7" stroke="#cbd5e1"/><text x="44" y="416" class="body">Atendente</text><rect x="222" y="388" width="330" height="104" rx="10" fill="#cffafe" stroke="#cbd5e1"/><text x="234" y="416" class="body">Abrir ordem de serviço</text><rect x="572" y="388" width="360" height="104" rx="10" fill="#fed7aa" stroke="#cbd5e1"/><text x="584" y="416" class="body">OS recebida</text><rect x="952" y="388" width="456" height="104" rx="10" fill="#ede9fe" stroke="#cbd5e1"/><text x="964" y="416" class="body">Veículo existente; itens opcionais</text><rect x="32" y="516" width="170" height="104" rx="10" fill="#fef3c7" stroke="#cbd5e1"/><text x="44" y="544" class="body">Mecânico</text><rect x="222" y="516" width="330" height="104" rx="10" fill="#cffafe" stroke="#cbd5e1"/><text x="234" y="544" class="body">Iniciar diagnóstico</text><rect x="572" y="516" width="360" height="104" rx="10" fill="#fed7aa" stroke="#cbd5e1"/><text x="584" y="544" class="body">Diagnóstico iniciado</text><rect x="952" y="516" width="456" height="104" rx="10" fill="#ede9fe" stroke="#cbd5e1"/><text x="964" y="544" class="body">RECEBIDA → EM_DIAGNOSTICO</text><rect x="32" y="644" width="170" height="104" rx="10" fill="#fef3c7" stroke="#cbd5e1"/><text x="44" y="672" class="body">Mecânico</text><rect x="222" y="644" width="330" height="104" rx="10" fill="#cffafe" stroke="#cbd5e1"/><text x="234" y="672" class="body">Cadastrar diagnóstico e orçamento</text><rect x="572" y="644" width="360" height="104" rx="10" fill="#fed7aa" stroke="#cbd5e1"/><text x="584" y="672" class="body">Orçamento gerado; OS em espera</text><rect x="952" y="644" width="456" height="104" rx="10" fill="#ede9fe" stroke="#cbd5e1"/><text x="964" y="672" class="body">Preços do catálogo; registro atômico</text><text x="964" y="695" class="body">do orçamento, itens, OS e e-mail</text><rect x="32" y="772" width="170" height="104" rx="10" fill="#fef3c7" stroke="#cbd5e1"/><text x="44" y="800" class="body">Worker SMTP</text><rect x="222" y="772" width="330" height="104" rx="10" fill="#cffafe" stroke="#cbd5e1"/><text x="234" y="800" class="body">Enviar orçamento pendente</text><rect x="572" y="772" width="360" height="104" rx="10" fill="#fed7aa" stroke="#cbd5e1"/><text x="584" y="800" class="body">Orçamento enviado ao cliente</text><rect x="952" y="772" width="456" height="104" rx="10" fill="#ede9fe" stroke="#cbd5e1"/><text x="964" y="800" class="body">Repetir em falha; não enviar expirado</text><rect x="32" y="900" width="170" height="104" rx="10" fill="#fef3c7" stroke="#cbd5e1"/><text x="44" y="928" class="body">Cliente</text><rect x="222" y="900" width="330" height="104" rx="10" fill="#cffafe" stroke="#cbd5e1"/><text x="234" y="928" class="body">Confirmar aprovação / reprovação</text><rect x="572" y="900" width="360" height="104" rx="10" fill="#fed7aa" stroke="#cbd5e1"/><text x="584" y="928" class="body">Orçamento aprovado / rejeitado</text><rect x="952" y="900" width="456" height="104" rx="10" fill="#ede9fe" stroke="#cbd5e1"/><text x="964" y="928" class="body">Token válido e uso único; decisão</text><text x="964" y="951" class="body">atômica com estado da OS</text></svg>
