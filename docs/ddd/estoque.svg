<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="948" viewBox="0 0 1440 948" role="img" aria-label="Event Storming · peças e insumos"><rect width="100%" height="100%" fill="#f8fafc"/><style>text{font-family:Arial,sans-serif;fill:#172033}.title{font-size:28px;font-weight:bold}.sub{font-size:16px}.label{font-size:15px;font-weight:bold}.body{font-size:16px}</style><text x="32" y="42" class="title">Event Storming · peças e insumos</text><text x="32" y="74" class="sub">O MVP controla saldo e movimentos. Reserva, fornecedor e pendência de peças não são funcionalidades entregues.</text><text x="44" y="114" class="label">ATOR</text><text x="234" y="114" class="label">COMANDO / AÇÃO</text><text x="584" y="114" class="label">EVENTO / RESULTADO</text><text x="964" y="114" class="label">REGRA / POLÍTICA</text><rect x="32" y="132" width="170" height="104" rx="10" fill="#fef3c7" stroke="#cbd5e1"/><text x="44" y="160" class="body">Estoquista</text><rect x="222" y="132" width="330" height="104" rx="10" fill="#cffafe" stroke="#cbd5e1"/><text x="234" y="160" class="body">Cadastrar peça / insumo</text><rect x="572" y="132" width="360" height="104" rx="10" fill="#fed7aa" stroke="#cbd5e1"/><text x="584" y="160" class="body">Peça cadastrada; saldo inicial registrado</text><rect x="952" y="132" width="456" height="104" rx="10" fill="#ede9fe" stroke="#cbd5e1"/><text x="964" y="160" class="body">SKU único; preço e quantidade ≥ 0</text><rect x="32" y="260" width="170" height="104" rx="10" fill="#fef3c7" stroke="#cbd5e1"/><text x="44" y="288" class="body">Mecânico</text><rect x="222" y="260" width="330" height="104" rx="10" fill="#cffafe" stroke="#cbd5e1"/><text x="234" y="288" class="body">Consultar catálogo</text><rect x="572" y="260" width="360" height="104" rx="10" fill="#fed7aa" stroke="#cbd5e1"/><text x="584" y="288" class="body">Peças e preços disponibilizados</text><rect x="952" y="260" width="456" height="104" rx="10" fill="#ede9fe" stroke="#cbd5e1"/><text x="964" y="288" class="body">Somente leitura; não altera saldo</text><rect x="32" y="388" width="170" height="104" rx="10" fill="#fef3c7" stroke="#cbd5e1"/><text x="44" y="416" class="body">Estoquista</text><rect x="222" y="388" width="330" height="104" rx="10" fill="#cffafe" stroke="#cbd5e1"/><text x="234" y="416" class="body">Registrar entrada / saída</text><rect x="572" y="388" width="360" height="104" rx="10" fill="#fed7aa" stroke="#cbd5e1"/><text x="584" y="416" class="body">Saldo ajustado; movimento registrado</text><rect x="952" y="388" width="456" height="104" rx="10" fill="#ede9fe" stroke="#cbd5e1"/><text x="964" y="416" class="body">Motivo obrigatório; delta diferente de zero</text><rect x="32" y="516" width="170" height="104" rx="10" fill="#fef3c7" stroke="#cbd5e1"/><text x="44" y="544" class="body">Mecânico</text><rect x="222" y="516" width="330" height="104" rx="10" fill="#cffafe" stroke="#cbd5e1"/><text x="234" y="544" class="body">Iniciar OS aprovada</text><rect x="572" y="516" width="360" height="104" rx="10" fill="#fed7aa" stroke="#cbd5e1"/><text x="584" y="544" class="body">Saldo baixado; movimento por OS</text><rect x="952" y="516" width="456" height="104" rx="10" fill="#ede9fe" stroke="#cbd5e1"/><text x="964" y="544" class="body">Verificar todas as peças antes de</text><text x="964" y="567" class="body">persistir; gravação única em transação</text><rect x="32" y="644" width="170" height="104" rx="10" fill="#fef3c7" stroke="#cbd5e1"/><text x="44" y="672" class="body">Sistema</text><rect x="222" y="644" width="330" height="104" rx="10" fill="#cffafe" stroke="#cbd5e1"/><text x="234" y="672" class="body">Rejeitar saldo insuficiente</text><rect x="572" y="644" width="360" height="104" rx="10" fill="#fed7aa" stroke="#cbd5e1"/><text x="584" y="672" class="body">Execução não iniciada</text><rect x="952" y="644" width="456" height="104" rx="10" fill="#ede9fe" stroke="#cbd5e1"/><text x="964" y="672" class="body">OS e movimentos permanecem inalterados</text><rect x="32" y="772" width="170" height="104" rx="10" fill="#fef3c7" stroke="#cbd5e1"/><text x="44" y="800" class="body">Sistema</text><rect x="222" y="772" width="330" height="104" rx="10" fill="#cffafe" stroke="#cbd5e1"/><text x="234" y="800" class="body">Detectar atualização concorrente</text><rect x="572" y="772" width="360" height="104" rx="10" fill="#fed7aa" stroke="#cbd5e1"/><text x="584" y="800" class="body">Conflito de gravação</text><rect x="952" y="772" width="456" height="104" rx="10" fill="#ede9fe" stroke="#cbd5e1"/><text x="964" y="800" class="body">UPDATE usa saldo e status originais;</text><text x="964" y="823" class="body">rollback integral; HTTP 409</text></svg>
