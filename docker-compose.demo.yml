# Optional overlay: docker compose -f docker-compose.yml -f docker-compose.demo.yml ...
services:
  mailpit:
    image: axllent/mailpit:v1.20
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
  api:
    environment:
      Estimates__PublicBaseUrl: http://localhost:8080
      Smtp__Host: mailpit
      Smtp__Port: 1025
      Smtp__EnableSsl: "false"
      Smtp__From: oficina@example.test
      Smtp__Username: ""
      Smtp__Password: ""
    depends_on:
      mailpit:
        condition: service_started
